<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        continuar = true

        while(continuar){
            a = parseInt(prompt("numero 1: "))
            b = parseInt(prompt("numero 2: "))

            alert(a+b)

            continuar = confirm("desea continuar ?")
        }
    </script>
