<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero = 1;
        while(numero <= 5){
            document.write(numero+"<br>")
            numero+=1;
        }
        document.write("*******************<br>")
        let a = 10;
        do{
            document.write(a+"<br>")
            a-=1;
        }while(a >= 1)
    </script>
</body>
</html>
