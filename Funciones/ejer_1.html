<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <input type="number" id="numero" placeholder="numero">
        <button onclick="numeros()">generar</button>
    </div>
    <script>
        function numeros(){
            n = document.getElementById("numero").value;
            for(let i=1; i<=n; i++){
                document.write(i+"<br>")
            }
        }
    </script>
</body>
</html>
