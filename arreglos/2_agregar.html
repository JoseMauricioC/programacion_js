<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numeros = []

        for (let i = 1; i < 10; i++) {
            numeros.push(i)
        }

        document.write(numeros)
        document.write("<br>")

        // agrega al principio 
        let numeros1 = []
        for (let i = 1; i < 10; i++) {
            numeros1.unshift(i)
        }
        document.write(numeros1)

    </script>
</body>

</html>
