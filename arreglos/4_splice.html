<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //insertar un elemnto arreglo.splice(índice_inicio, cuántos_eliminar, nuevos_elementos...)
        let numeros1 = [1,2,3]
        numeros1.splice(3,0,4)
        document.write(numeros1)

        let numeros = [1, 2, 5];

        // Insertar el 3 y el 4 en la posición 2, sin eliminar nada (0)
        numeros.splice(2, 0, 3, 4);
        console.log(numeros); // [1, 2, 3, 4, 5]

        // Eliminar el "2" (está en la posición 1)
        let num = [1, 2, 3, 4, 5]
        num.splice(1, 1);
        console.log(num); // [1, 3, 4, 5]
    </script>
